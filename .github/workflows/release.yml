name: Release Build & Publish

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  release:
    name: Build DMG & Publish Release
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Scripts Executable
        run: |
          chmod +x build_app.sh install.sh

      - name: Run Test Suite
        run: |
          swift test

      - name: Build Application and Package DMG
        run: |
          ./build_app.sh

      - name: Verify DMG Artifact Exists
        run: |
          if [ ! -f "Resource Monitor.dmg" ]; then
            echo "::error::Resource Monitor.dmg was not generated!"
            exit 1
          fi
          echo "Generated DMG size: $(du -sh "Resource Monitor.dmg" | cut -f1)"

      - name: Extract Release Version
        id: version_info
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Info.plist 2>/dev/null || echo "1.1.0")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Target Version: ${VERSION} (Tag: ${TAG})"

      - name: Generate Release Notes
        run: |
          cat << 'EOF' | sed 's/^          //' > release_notes.md
          ## Resource Monitor v1.1.0

          Production-ready release of Resource Monitor for macOS 14+ (Apple Silicon).

          ### What's New in v1.1.0:
          - **Comprehensive VoiceOver Accessibility**: Full a11y labels, traits, values, and hints across all circular gauges, summary cards, hierarchical process rows, filter pills, and alert threshold sliders.
          - **macOS Native Keyboard Navigation**: Instant navigation via standard keyboard shortcuts (`Cmd-1`..`Cmd-4` for tabs, `Cmd-F` for search focus, `Cmd-,` for preferences, `Escape` for sheet dismissal, `Cmd-C` to copy diagnostics).
          - **Zero Layout Jitter**: Smooth process row hover state with fixed 22x22 trailing frame and aligned metric table columns (CPU, Memory, Disk I/O).
          - **Diagnostics & Bridging Resilience**: Robust `NSNumber` numeric bridging preventing metric drops for battery wattage and cumulative disk I/O; `ProcessBufferSlab` sysctl `ENOMEM` retry with 2x headroom; static MIB caching for Rosetta 2 detection.
          - **Sleep/Wake Jump Safeguards**: Clock-step protections in `NetworkMonitorService` and `DiskAndPowerService` preventing distorted throughput spikes after Mac sleep/wake.
          - **Full Hardware Parity in Diagnostics Export**: Integrated `"gpu"` metrics dictionary in JSON snapshots and GPU subsystem row in Markdown summaries.
          - **Expanded Apple Silicon Lineup**: Complete model identifier mapping for Apple Silicon M2, M3, and M4 families.
          - **Process List Empty State**: Contextual empty state card with quick "Clear Filter & Search" action button.
          - **Easter Egg**: The 7-click "WycDev" Easter egg with companion icons and physics confetti remains preserved and fully accessible.

          ### Gatekeeper Installation Note:
          If macOS displays an unsigned developer warning, right-click (Control-click) `Resource Monitor.app` in `/Applications` and select **Open**, or run:
          ```bash
          xattr -cr "/Applications/Resource Monitor.app"
          ```
          EOF

      - name: Prune Target Release If Exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version_info.outputs.tag }}"
          echo "Checking if release for ${TAG} already exists..."
          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true

      - name: Publish Latest GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version_info.outputs.tag }}"
          VERSION="${{ steps.version_info.outputs.version }}"

          # Remove local or remote tag if it exists
          git tag -d "${TAG}" 2>/dev/null || true
          git push origin ":refs/tags/${TAG}" 2>/dev/null || true

          gh release create "${TAG}" "Resource Monitor.dmg" \
            --title "Resource Monitor v${VERSION}" \
            --notes-file release_notes.md
